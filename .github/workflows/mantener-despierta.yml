# Llama a /api/health cada 5 minutos para que Azure no apague la app.
#
# En el plan gratuito, App Service descarga la app tras unos 20 minutos sin
# trafico, y con ella se detiene el servicio que manda los recordatorios de
# "es hora de tu tarea". Este ping la mantiene despierta (y a Supabase activa).
#
# Ojo: GitHub no garantiza la puntualidad de los "schedule" (puede atrasarlos
# varios minutos) y los desactiva si el repo pasa 60 dias sin actividad. Si
# hiciera falta mas precision, cron-job.org puede llamar a la misma URL.
name: Mantener la API despierta

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Llamar a /api/health
        run: curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 20 https://better-me-d6gugua2dnhucpfg.centralus-01.azurewebsites.net/api/health
